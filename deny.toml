# cargo-deny: licences compatible with an MIT app sold through the Microsoft Store (README,
# "Bundled conversion tools"), and crates only from crates.io.

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  "bzip2-1.0.6",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
