# cargo-deny: licences compatible with an MIT app sold through the Microsoft Store (README,
# "Bundled conversion tools"), and crates only from crates.io.

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  "bzip2-1.0.6",
  # whisper-rs and whisper-rs-sys (offline transcription): public-domain dedication.
  "Unlicense",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
# Many crates appear in two versions; only the rule below fails the check.
multiple-versions = "allow"
deny = [
  # kreuzberg-tesseract 4.10.4 asks for any `zip` from 7 up in its build script, which no longer
  # compiles against zip 9 (`mangled_name` returns a Result there). Cargo.lock keeps it on the
  # zip 8 that docx-rs already uses; a lockfile update (Dependabot's included) may move it to
  # the zip 9 that rust_xlsxwriter and calamine need, so this fails the check instead of three builds. Undo
  # it by pointing kreuzberg-tesseract's "zip 9.x" back at "zip 8.x" in Cargo.lock.
  { crate = "zip:>=9", wrappers = ["rust_xlsxwriter", "calamine"], reason = "kreuzberg-tesseract's build script does not compile with zip 9" },
]
