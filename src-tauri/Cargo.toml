[package]
name = "kalamu"
description = "Transcribe interviews and read scanned or handwritten documents with the AI provider of your choice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Desktop app, not a library: never goes to crates.io.
publish = false

[lib]
# Tauri's entry point lives in the lib; main.rs is a thin shim. Only `rlib`, as in Live
# Translation: the template's `staticlib` and `cdylib` are for mobile and cost a full LTO link.
name = "kalamu_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow.workspace = true
keyring = "4.2.0"
reqwest.workspace = true
kalamu-catalog.workspace = true
kalamu-core.workspace = true
kalamu-engine.workspace = true
kalamu-export.workspace = true
kalamu-media.workspace = true
kalamu-offline.workspace = true
kalamu-prompts.workspace = true
kalamu-projects.workspace = true
kalamu-dictionary.workspace = true
kalamu-search.workspace = true
kalamu-providers.workspace = true
kalamu-store.workspace = true
serde.workspace = true
serde_json.workspace = true
# The system's languages, for the interface's default: the webview's own list is unreliable on
# macOS, where WebKit reports only the languages the app bundle declares.
sys-locale = "0.3.2"
base64.workspace = true
# `tray-icon`: the notification-area icon in `src/tray.rs`, so jobs run with the window closed.
# `protocol-asset`: the review view's player streams recordings from disk; the scope starts
# empty and `piece_audio` opens one file at a time.
tauri = { version = "2.12.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
# A second launch focuses the running window instead of opening a second job queue on the same
# database. Registered first in the builder, as the plugin requires.
tauri-plugin-single-instance = "2.5.4"
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The message shown when the app cannot start (`src/start_failure.rs`), before the interface
# exists: the system's own message box, called directly on the main thread. The version and
# features the dialog plugin already builds, so nothing new is compiled (0.18 is out; the plugin
# is on 0.17).
rfd = { version = "0.18.0", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(windows)'.dependencies]
# The Job Object that ends FFmpeg, llama.cpp and the Whisper helper with the app
# (`src/platform/windows.rs`). The version the tree already builds, so nothing new is compiled.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Ends the programs the app started when it quits (`src/platform/macos.rs`).
libc = "0.2.191"
# Whisper on the graphics processor (Metal), which every Apple Silicon Mac has.
kalamu-offline = { workspace = true, features = ["metal"] }
# Security-scoped bookmarks for the Mac App Store's sandboxed build (`src/platform/macos.rs`).
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSError",
    "NSString",
    "NSURL",
] }

[features]
# Standard Tauri production feature: serve the bundled front end over the custom protocol
# instead of the dev server. Enabled automatically by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

# The workspace's lints, except that unsafe code is denied rather than forbidden: the shell
# calls the system's own API in `src/platform/` only, for the Mac App Store build's
# security-scoped bookmarks and for ending the programs the app started, where each `#[allow]`
# says why.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
tempfile.workspace = true
