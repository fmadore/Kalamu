[workspace]
resolver = "3"
# `helpers/whisper-vulkan` is Whisper on the graphics processor through Vulkan, a program of its
# own beside the app (`crates/offline/src/whisper/helper.rs`). It needs LunarG's Vulkan SDK on
# Windows, so `--workspace` commands that run where there is none exclude it.
members = ["crates/*", "src-tauri", "helpers/whisper-vulkan"]
default-members = ["crates/*"]

[workspace.package]
version = "1.10.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
authors = ["Frédérick Madore"]
repository = "https://github.com/fmadore/Kalamu"

[workspace.dependencies]
kalamu-core = { path = "crates/core" }
kalamu-catalog = { path = "crates/catalog" }
kalamu-prompts = { path = "crates/prompts" }
kalamu-media = { path = "crates/media" }
kalamu-providers = { path = "crates/providers" }
kalamu-store = { path = "crates/store" }
kalamu-export = { path = "crates/export" }
kalamu-engine = { path = "crates/engine" }
kalamu-offline = { path = "crates/offline" }
kalamu-projects = { path = "crates/projects" }
kalamu-dictionary = { path = "crates/dictionary" }
kalamu-search = { path = "crates/search" }

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
# Reads the workbooks back in the export crate's tests (MIT).
calamine = { version = "0.38.0", default-features = false }
csv = "1.4.0"
docx-rs = "0.4.22"
futures = "0.3.34"
# Pure-Rust PDF rasterizer (no unsafe code), with the standard fonts and CMaps built in: page
# images for engines that read images (Tesseract).
hayro = "0.9.0"
# Free space on the models' drive before a download (MIT or Apache-2.0).
fs4 = "1.1.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp"] }
lopdf = { version = "0.47.0", default-features = false }
tiff = "0.11.3"
# Excel workbooks (.xlsx) for the tables Kalamu writes as CSV: pure Rust, MIT OR Apache-2.0;
# its zip deflates with zopfli and zlib-rs, no C library.
rust_xlsxwriter = { version = "0.103.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "native-tls", "system-proxy"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# wry pins sha2 0.10; moving ahead would ship two copies in the exe.
sha2 = "0.10.9"
similar = "3.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
unicode-normalization = "0.1.26"
# Grapheme, word and sentence boundaries (UAX #29), where the search by meaning cuts a text into
# chunks: already built for the tree (MIT or Apache-2.0).
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
