# cargo-audit settings, read by the RustSec step in CI.

[advisories]
# zip 8 (through docx-rs 0.4.22, the latest, which requires zip ^8.6): the three advisories
# concern ZipArchive::extract and ZipStreamReader::extract writing an archive's entries to
# disk (symlink targets, Unix permissions, SUID bits). Kalamu never extracts archives: it
# writes Word files with ZipWriter and reads .docx entries into memory. Fixed in zip 9; remove
# these lines when docx-rs moves to it. Recorded in docs/decisions/2026-10-24-offline-and-audio.md.
#
# A fourth, GHSA-m665-v7pm-7grj ("zip cloaking", 28 October 2026, fixed in zip 9.0.5), is a
# parser differential: ZipArchive names an entry from the central directory, ZipStreamReader
# from the local header, so an archive approved by one can write another file when the other
# extracts it to disk. Neither docx-rs nor Kalamu uses ZipStreamReader or extracts anything;
# the worst a crafted .docx can do is show Kalamu other text than Word shows. It has no RustSec
# id yet; add it here when it gets one.
#
# Four more, published 29 October 2026 and all fixed in zip 9, have no RustSec id yet either;
# add each here when it gets one. docx-rs builds zip with only its `deflate` feature, so none
# is reachable:
# - GHSA-q7v9-x93c-xqv3 (symlink target allocation) and GHSA-hjqx-j4rw-g7xv (symlink targets
#   checked lexically) are in ZipArchive::extract, which nothing calls;
# - GHSA-9hj8-73fh-9963 (Shrink decoder, ZIP64 size) needs the `legacy-zip` feature and
#   GHSA-8hxf-qr8p-62x4 (AES HMAC skipped at early EOF) the `aes-crypto` feature; neither is
#   compiled (`cargo tree -e features -i zip`).
#
# glib 0.18 (RUSTSEC-2024-0429, GHSA-wrw7-89jp-8q8g, an unsound VariantStrIter): only the GTK
# stack Tauri, wry, tao, muda and tray-icon use on Linux needs it. Kalamu ships for Windows
# only, where none of it is compiled (`cargo tree -i glib --target x86_64-pc-windows-msvc` is
# empty), and nothing calls VariantStrIter. Fixed in glib 0.20; remove this line when Tauri
# moves to it. Recorded in docs/decisions/2026-10-25-analyses-review-and-pipelines.md.
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2024-0429",
]
