name: A Clang the image's standard library accepts
description: >
  The Windows x64 image's standard library (MSVC 14.52, from 16 November 2026) refuses a Clang
  older than 22, and the image still ships 20. This installs LLVM 22.1.8 from LLVM's own release
  on GitHub, checked against its SHA-256, where the image's Clang is older; nothing is done once
  the image's own is new enough. It replaces `choco upgrade llvm`: Chocolatey's community feed
  refused CI's requests on 23 November 2026 and choco still exited 0, so the build went on with
  Clang 20 and failed deep inside whisper.cpp. The step now fails here, saying why. Callers run
  it on Windows x64 only; ARM64's image is another.

runs:
  using: composite
  steps:
    - name: A Clang the image's standard library accepts
      shell: pwsh
      env:
        LLVM_VERSION: 22.1.8
        LLVM_SHA256: 16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c
      run: |
        $clang = 'C:\Program Files\LLVM\bin\clang-cl.exe'
        function Get-ClangMajor {
          if ((Test-Path $clang) -and ((& $clang --version | Out-String) -match 'version (\d+)')) { return [int]$Matches[1] }
          return 0
        }
        $major = Get-ClangMajor
        "clang-cl $major"
        if ($major -ge 22) { return }

        $name = "LLVM-$env:LLVM_VERSION-win64.exe"
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name"
        $installer = Join-Path $env:RUNNER_TEMP $name
        for ($try = 1; $try -le 3; $try++) {
          try {
            Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
            break
          } catch {
            if ($try -eq 3) { throw "LLVM $env:LLVM_VERSION could not be downloaded from $url : $_" }
            "Download failed ($_), trying again."
            Start-Sleep -Seconds (10 * $try)
          }
        }
        $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
        if ($hash -ne $env:LLVM_SHA256) { throw "$name has SHA-256 $hash, not the release's $env:LLVM_SHA256." }

        # The NSIS installer, silent, into C:\Program Files\LLVM over the image's own: what
        # Chocolatey's llvm package ran.
        $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw "The LLVM installer exited with code $($process.ExitCode)." }
        Remove-Item $installer

        $major = Get-ClangMajor
        & $clang --version
        if ($major -lt 22) { throw "clang-cl is still version $major after installing LLVM $env:LLVM_VERSION." }
