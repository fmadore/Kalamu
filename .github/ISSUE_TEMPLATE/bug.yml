name: Report a bug
description: Something in Kalamu does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste API keys or confidential material.** This page is public.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. An error message helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kalamu version
      description: Settings › About.
  - type: input
    id: windows
    attributes:
      label: Windows version and PC
      placeholder: Windows 11 24H2, ARM64
