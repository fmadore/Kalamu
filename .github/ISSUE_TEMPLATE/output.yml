name: Report harmful output
description: A model wrote something offensive or harmful. For a misreading, correct it in the review.
title: "[Output] "
labels: ["ai-output"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Kalamu shows text written by the AI model you chose, which the model's provider is answerable for; a report lets us warn other researchers and, where a default prompt invites it, change the prompt. A model misreading or inventing is expected from time to time: correct it in the review, no report needed.

        **Do not paste confidential material.** This page is public. Describe the problem, and quote only what is needed and safe to share.
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - Offensive or harmful text
        - Other
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Task
      options:
        - Extract text
        - Correct existing text
        - Analyse texts
        - Detailed table of contents
        - Transcribe recordings
        - YouTube video
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider and model
      description: As shown in the review, over the text (for example gemini-3.8-flash).
      placeholder: gemini-3.8-flash
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the output said, and what the source says instead, as far as you can share it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kalamu version
      description: Settings › About.
