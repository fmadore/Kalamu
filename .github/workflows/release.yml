name: Release

# Builds the Windows installers and Microsoft Store packages natively on x64 and ARM64, and the
# macOS disk image on Apple Silicon, each with the bundled FFmpeg, whisper.cpp and the
# third-party notices, and attaches them to a draft GitHub release, which is published only once
# every asset is attached. Ported from Live Translation's release.yml (see
# docs/decisions/2026-10-28-release-workflow.md for where it differs, and
# docs/decisions/2026-11-02-macos.md for macOS): both Windows architectures get an installer as
# well as a Store package.
#
# Release assets: Kalamu_<version>_<arch>-setup.exe  the Windows installers, unsigned
#                 Kalamu_<version>_<arch>.msix       to sign and install locally for verification
#                 Kalamu_<version>.msixbundle        the Store submission (docs/microsoft-store.md)
#                 Kalamu_<version>_aarch64.dmg       the macOS disk image, signed and notarised
#                 kalamu-samples.zip                 samples/, the files the certification notes use
#                 SHA256SUMS                         the SHA-256 of each asset above, attested
#
# Normal flow: bump the version files, add docs/release-<version>.md, merge, then
# `git tag v1.0.0 && git push origin v1.0.0`. `prepare` checks the tag against the version files
# and creates the draft; `windows` builds each architecture once and makes its installer and
# Store package, `bundle` the Store bundle, `macos` the app and `notarise` the signed and
# notarised disk image; `checksums` lists every asset's SHA-256, `attest` attests them and
# `upload` attaches them all; `publish` makes the release public with docs/release-<version>.md
# from the tagged commit (and docs/checking-downloads.md after it) as its body, as a pre-release
# while the version starts with 0. Until that last step nothing is public, so a failed job leaves
# a draft to re-run rather than a spent version. A hyphenated tag (v0.3.0-rc1) is a validation
# build: the same assets in a draft that stays unpublished until someone promotes it by hand.
#
# Secrets and tokens stay away from build code (#145): every job that runs `npm ci`, a build
# script or the compiler has a read-only token and no secret. Only `notarise` sees Apple's
# secrets, and it runs no package's install script and compiles nothing: it signs the app
# `macos` built, with Tauri's bundler, as app-store.yml does. Only `prepare`, `upload` and
# `publish` can write to the repository, and they run nothing but `gh`, `zip` and the shell.
#
# Rebuild a tag: run this workflow manually (Actions tab -> Run workflow) with an existing tag.
# A release that is already published keeps its title, body and state; only its assets are
# replaced.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build installers for (e.g. v0.3.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Read by the shell as "$TAG", never written into a script: a tag name is the pusher's text.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Cheap checks before Windows build time, then the one release every later job uploads to.
  # Three files carry the version: package.json, src-tauri/tauri.conf.json (the installer's name
  # and version) and the workspace Cargo.toml (every crate's). They move together.
  prepare:
    name: Version check and draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Check the tag against the version files
        id: version
        shell: bash
        run: |
          package=$(jq -r .version package.json)
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          # The first `version =` under [workspace.package], not a dependency's.
          cargo=$(awk -F'"' '/^\[/ { in_package = /^\[workspace\.package\]/ } in_package && /^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)

          if [ "$package" != "$tauri" ] || [ "$package" != "$cargo" ]; then
            echo "::error::The version files disagree: package.json says $package, src-tauri/tauri.conf.json $tauri and Cargo.toml ${cargo:-no [workspace.package] version}. Bump all three together."
            exit 1
          fi

          case "$TAG" in
            "v$package" | "v$package"-?*) ;;
            *)
              echo "::error::Tag $TAG does not match the version files: expected v$package, or v$package-<suffix> for a validation build."
              exit 1
              ;;
          esac

          # A release created for a tag that does not exist would create the tag on publishing,
          # on the default branch.
          if ! git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG is not a tag on GitHub."
            exit 1
          fi

          echo "version=$package" >> "$GITHUB_OUTPUT"

      # As in Live Translation, the release is found or created here, and `upload` attaches every
      # asset to it.
      - name: Find or create the draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # GET /releases/tags/{tag} does not return drafts, so list every release instead.
          listing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.tag_name, (.id | tostring), (.draft | tostring)] | @tsv')
          mapfile -t matches < <(awk -F'\t' -v tag="$TAG" '$1 == tag' <<< "$listing")

          case ${#matches[@]} in
            0) id='' state=none ;;
            1)
              IFS=$'\t' read -r _ id draft <<< "${matches[0]}"
              if [ "$draft" = true ]; then state=draft; else state=published; fi
              ;;
            *)
              echo "::error::$TAG has ${#matches[@]} releases. Delete the stray draft on the Releases page, then re-run."
              exit 1
              ;;
          esac

          validation=false
          if [[ "$TAG" == *-* ]]; then validation=true; fi
          prerelease=$validation
          if [[ "$VERSION" == 0.* ]]; then prerelease=true; fi

          # `publish` uses this file as the release body, so it must be in the tagged commit.
          notes="docs/release-$VERSION.md"
          if [ "$validation" = false ] && [ "$state" != published ] && [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty in $TAG. It becomes the release body, so it has to be in the tagged commit."
            exit 1
          fi

          case $state in
            none)
              if [ "$validation" = true ]; then title=$TAG; else title="Kalamu $VERSION"; fi
              id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$TAG" -f name="$title" -F draft=true -F prerelease="$prerelease" \
                --jq .id)
              echo "Created draft release $id for $TAG."
              ;;
            draft) echo "Reusing draft release $id for $TAG." ;;
            published)
              echo "::notice::$TAG is already published; its assets are replaced and its title, body and state are left alone."
              ;;
          esac

          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::No release id for $TAG."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # The files the Store's certification notes point reviewers to (samples/README.txt).
      - name: Zip the sample files
        shell: bash
        run: (cd samples && zip -X -q ../kalamu-samples.zip ./*)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-samples
          path: kalamu-samples.zip
          retention-days: 1
          if-no-files-found: error

  # Each architecture compiled once, natively, and packaged twice from that build: the installer
  # and the Store package (.github/actions/windows-packages, which the packaging dry run runs on
  # pull requests too). Nothing here is signed.
  windows:
    name: Installer and MSIX package (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Build and package
        id: packages
        uses: ./.github/actions/windows-packages
        with:
          arch: ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-installer-${{ matrix.arch }}
          path: ${{ steps.packages.outputs.installer }}
          retention-days: 1
          if-no-files-found: error

      # The bare .msix is what a tester signs and installs locally: signing a bundle does not
      # sign the packages inside it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-msix-${{ matrix.arch }}
          path: ${{ steps.packages.outputs.msix }}
          retention-days: 1
          if-no-files-found: error

  # One multi-architecture .msixbundle carrying both packages: the single file Partner Center
  # takes, so no architecture ships stale on a later update.
  bundle:
    name: Store bundle (x64 + ARM64)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Download both architectures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-msix-*
          path: packages
          merge-multiple: true

      - name: Bundle
        id: bundle
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packages = Get-ChildItem 'packages' -Filter *.msix
          if ($packages.Count -ne 2) {
            throw "Expected an x64 and an ARM64 .msix, found $($packages.Count): $($packages.Name -join ', ')"
          }
          # MakeAppx ships with the Windows SDK on windows-latest; take its highest version.
          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found; the Windows SDK is missing.' }
          $bundle = "Kalamu_${version}.msixbundle"
          # /bv must be a four-part version, at least as high as the packages inside.
          & $makeAppx.FullName bundle /d 'packages' /p $bundle /bv "$version.0" /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE" }
          "bundle=$bundle" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-msixbundle
          path: ${{ steps.bundle.outputs.bundle }}
          retention-days: 1
          if-no-files-found: error

  # The macOS app for Apple Silicon, compiled natively and left unsigned: `notarise` signs it.
  # Only the executable, the programs and licences beside it (src-tauri/binaries) and the built
  # front end the configuration names go on; the bundler makes the .app from them there. A tar
  # keeps their executable bits, which an artifact alone loses.
  macos:
    name: App (Apple Silicon)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - run: rustup toolchain install

      # Tesseract's build (kreuzberg-tesseract) keeps the sources it downloads in a folder of
      # its own, `target/tesseract` by default (`.cargo/config.toml`). The Rust cache restores
      # `target/` with that folder emptied, and the build then finds no sources to build: keep
      # it out of the cache, in the runner's temporary folder.
      - name: Keep Tesseract's build outside the cached target folder
        shell: bash
        run: echo "TESSERACT_RS_CACHE_DIR=$RUNNER_TEMP/tesseract" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: whisper-cpu-${{ runner.arch }}-v2
          save-if: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch the bundled FFmpeg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-ffmpeg.mjs "$TARGET"

      # llama.cpp's program for the offline OCR models, checked against scripts/llama.json.
      - name: Fetch the bundled llama.cpp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-llama.mjs "$TARGET"

      - name: Write the third-party notices
        run: node scripts/third-party-notices.mjs "$TARGET"

      - name: Build the app, unsigned
        run: >-
          npx tauri build --target "$TARGET" --no-bundle
          --config src-tauri/tauri.ffmpeg.conf.json

      - name: Pack the build for signing
        run: tar -cf "$RUNNER_TEMP/macos-build.tar" "target/$TARGET/release/kalamu" src-tauri/binaries build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-build
          path: ${{ runner.temp }}/macos-build.tar
          retention-days: 1
          if-no-files-found: error

  # The macOS disk image, signed with the Developer ID Application certificate and notarised by
  # Apple, so Gatekeeper opens it without asking (docs/decisions/2026-11-04-macos-notarisation.md).
  # `tauri bundle` makes the .app from the build `macos` left, imports APPLE_CERTIFICATE (the
  # .p12, base64) into a temporary keychain, signs FFmpeg, ffprobe, the llama.cpp programs and
  # then the app with APPLE_SIGNING_IDENTITY, which overrides the ad-hoc "-" of
  # src-tauri/tauri.macos.conf.json that local builds keep, sends the app to Apple's notary
  # service with APPLE_ID, an app-specific APPLE_PASSWORD and APPLE_TEAM_ID, staples the ticket
  # to it and makes the image. The packages are installed without their install scripts and
  # nothing is compiled, so no dependency's code runs beside the secrets.
  notarise:
    name: Disk image, signed and notarised (Apple Silicon)
    needs: macos
    runs-on: macos-latest
    # Notarisation usually answers in minutes, but Apple's queue can hold a submission for
    # hours (a new team's first ones especially): the first test run was cancelled at 90.
    timeout-minutes: 240
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # Without them the bundler would fall back to ad-hoc signing and skip notarisation with
      # only a warning: a release must not ship that way unnoticed.
      - name: Check the signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets for signing and notarising the Mac app: ${missing[*]}."
            exit 1
          fi

      # The bundler asks Cargo where the workspace builds; the pinned toolchain answers.
      - run: rustup toolchain install

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Tauri's command-line tool, which signs; --ignore-scripts so no package's install script
      # runs on this machine.
      - run: npm ci --ignore-scripts

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-build
          path: ${{ runner.temp }}

      - name: Unpack the build
        run: tar -xf "$RUNNER_TEMP/macos-build.tar"

      - name: Sign, notarise and make the disk image
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          npx tauri bundle --target "$TARGET" --bundles dmg
          --config src-tauri/tauri.ffmpeg.conf.json

      # What the image holds, as a user gets it: the app signed with the Developer ID, its
      # notarisation ticket stapled and accepted by Gatekeeper, FFmpeg and ffprobe signed with
      # the same identity and the hardened runtime, and every licence. Tauri removes the bare
      # .app once the image is made, so the image is opened.
      - name: Check the app
        id: dmg
        run: |
          dmg=$(ls "target/$TARGET/release/bundle/dmg/"Kalamu_*_aarch64.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          app="$mnt/Kalamu.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier|flags'
          for exe in "$app" "$app/Contents/MacOS/ffmpeg" "$app/Contents/MacOS/ffprobe" "$app/Contents/MacOS/llama-mtmd-cli" "$app/Contents/MacOS/llama-completion"; do
            details=$(codesign -dv --verbose=4 "$exe" 2>&1)
            grep -q '^Authority=Developer ID Application:' <<< "$details"               || { echo "::error::$exe is not signed with the Developer ID."; exit 1; }
            grep -q 'flags=.*runtime' <<< "$details"               || { echo "::error::$exe lacks the hardened runtime notarisation needs."; exit 1; }
          done
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          "$app/Contents/MacOS/ffmpeg" -hide_banner -version | sed -n 1p
          "$app/Contents/MacOS/ffprobe" -hide_banner -version | sed -n 1p
          "$app/Contents/MacOS/llama-mtmd-cli" --version
          "$app/Contents/MacOS/llama-completion" --version
          for licence in THIRD-PARTY-NOTICES.txt FFmpeg-LGPL-2.1.txt Opus-BSD-3-Clause.txt FFmpeg-BUILD.txt llama.cpp-MIT.txt llama.cpp-BUILD.txt; do
            test -s "$app/Contents/Resources/licenses/$licence"
          done
          ls -l "target/$TARGET/release/bundle/dmg/"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-dmg
          path: ${{ steps.dmg.outputs.dmg }}
          retention-days: 1
          if-no-files-found: error

  # Every asset the other jobs made, with SHA256SUMS listing each one's SHA-256. It runs when
  # some of them failed too, as each job used to attach its own: a validation build's draft then
  # still carries what was built, and `publish` refuses an incomplete release.
  checksums:
    name: Checksums
    needs: [prepare, windows, bundle, notarise]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No job produced an asset."
            exit 1
          fi
          sha256sum -- "${files[@]}" | LC_ALL=C sort -k2 > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/
          retention-days: 1
          if-no-files-found: error

  # A signed statement, kept by GitHub and checked with `gh attestation verify`, that each asset
  # in SHA256SUMS was built by this workflow from the tagged commit. This job alone may ask for
  # the identity token and write attestations; it reads only SHA256SUMS.
  attest:
    name: Build attestation
    needs: checksums
    if: ${{ !cancelled() && needs.checksums.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download the checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

  # Attaches every asset and SHA256SUMS to the draft, replacing assets of the same name.
  upload:
    name: Attach the assets
    needs: [prepare, checksums]
    if: ${{ !cancelled() && needs.checksums.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: Check and attach them
        working-directory: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum -c SHA256SUMS
          gh release upload "$TAG" ./* --clobber -R "$GITHUB_REPOSITORY"

  # The last step: every asset is attached and attested, so the draft can go public with the
  # prepared body from the tagged commit. A hyphenated tag is never published here, and a release
  # that is already published is left as it is.
  publish:
    name: Publish the release
    needs: [prepare, windows, bundle, notarise, upload, attest]
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Check the assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)
          if [ "$draft" != true ]; then
            echo "::notice::$TAG is already published; its title and body are left as they are."
            exit 0
          fi

          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets[].name')
          for asset in "Kalamu_${VERSION}_x64-setup.exe" "Kalamu_${VERSION}_arm64-setup.exe" \
            "Kalamu_${VERSION}_x64.msix" "Kalamu_${VERSION}_arm64.msix" "Kalamu_${VERSION}.msixbundle" \
            "Kalamu_${VERSION}_aarch64.dmg" kalamu-samples.zip SHA256SUMS; do
            if ! grep -qx "$asset" <<< "$assets"; then
              echo "::error::$asset is not attached; the release stays a draft."
              exit 1
            fi
          done

          # The notes written for this version, then how to check a download, the same for every
          # release with the version filled in (a tag cut before that page existed has the notes
          # alone).
          cp "docs/release-$VERSION.md" "$RUNNER_TEMP/notes.md"
          if [ -s docs/checking-downloads.md ]; then
            { echo; sed "s/<version>/$VERSION/g" docs/checking-downloads.md; } >> "$RUNNER_TEMP/notes.md"
          fi

          latest=true
          if [[ "$VERSION" == 0.* ]]; then latest=false; fi
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest="$latest" \
            --title "Kalamu $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
