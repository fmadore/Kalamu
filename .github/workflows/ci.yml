name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev

  rust:
    # Both architectures the app ships for, natively.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # whisper.cpp (crates/offline) builds with clang-cl and Ninja, as in Live Translation:
      # MSVC's compiler lacks ggml's fast paths on ARM64. Both ship with the Windows images.
      - name: Configure native Whisper compiler
        shell: pwsh
        run: |
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV
          "CXXFLAGS=/EHsc" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      # The toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when the GGML_* values in `.cargo/config.toml` change: whisper-rs-sys does not
          # rebuild ggml when they do, so a restored cache would keep the old instruction sets.
          prefix-key: whisper-cpu-${{ runner.arch }}-v1
          cache-on-failure: true
      # `tauri::generate_context!` needs the front-end folder to exist; the Rust lane does not
      # build the front end, so a stub stands in.
      - name: Front-end stub
        shell: bash
        run: mkdir -p build && echo '<!doctype html><title>stub</title>' > build/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The TypeScript bindings are generated by the tests; they must match what is committed.
      - name: Bindings up to date
        shell: bash
        run: git diff --exit-code -- src/lib/bindings

  rust-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      # Called directly rather than through the `cargo` proxy, which would first install the
      # whole pinned toolchain.
      - name: RustSec audit
        run: cargo-audit audit
      - name: Licences and sources
        run: cargo-deny check licenses sources
