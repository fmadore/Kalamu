name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev
      # Every main screen opens without an error in Chromium, the engine of Windows' WebView2;
      # the webkit job below opens them in macOS's.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:chromium

  # The interface in WebKit, the engine of macOS's webview, on a Mac: every main screen opens
  # without an error, shortcuts are written with ⌘, and the player takes the formats the engine
  # sends it there. Windows runs it in Chromium, where the frontend job opens the same screens.
  webkit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run test:webkit

  rust:
    # Every system and architecture the app ships for, natively: Windows x64 and ARM64, and
    # macOS on Apple Silicon.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # whisper.cpp and Tesseract (crates/offline) build with clang-cl and Ninja, as in Live
      # Translation: MSVC's compiler lacks ggml's fast paths on ARM64. Both ship with the Windows
      # images. On macOS the image's Apple clang and CMake need no setting.
      - name: Configure native Whisper and Tesseract compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV
          "CXXFLAGS=/EHsc" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      # Tesseract's build (kreuzberg-tesseract) keeps the sources it downloads in a folder of
      # its own, `target/tesseract` by default (`.cargo/config.toml`). The Rust cache restores
      # `target/` with that folder emptied, and the build then finds no sources to build: keep
      # it out of the cache, in the runner's temporary folder.
      - name: Keep Tesseract's build outside the cached target folder
        shell: bash
        run: echo "TESSERACT_RS_CACHE_DIR=$RUNNER_TEMP/tesseract" >> "$GITHUB_ENV"
      # The toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when the GGML_* values or the CMake toolchain files in `.cargo/config.toml`
          # change: whisper-rs-sys does not rebuild ggml when they do, so a restored cache would
          # keep the old instruction sets.
          prefix-key: whisper-cpu-${{ runner.arch }}-v2
          cache-on-failure: true
      # `tauri::generate_context!` needs the front-end folder to exist; the Rust lane does not
      # build the front end, so a stub stands in.
      - name: Front-end stub
        shell: bash
        run: mkdir -p build && echo '<!doctype html><title>stub</title>' > build/index.html
      # Whisper's Vulkan helper (helpers/whisper-vulkan) needs LunarG's SDK on Windows. The x64
      # lane builds, lints and tests it; the others leave it out, and release.yml builds it for
      # both Windows architectures.
      - name: Vulkan SDK
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/vulkan-sdk
      - name: Which crates
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = windows-latest ]; then
            echo "WORKSPACE_ARGS=--workspace" >> "$GITHUB_ENV"
          else
            echo "WORKSPACE_ARGS=--workspace --exclude whisper-vulkan" >> "$GITHUB_ENV"
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy ${{ env.WORKSPACE_ARGS }} --all-targets --locked -- -D warnings
      # French and English language data at the revision the app downloads, checked against
      # the same hashes, so the tests read a real page with Tesseract on every system.
      - name: Tesseract language data for the smoke test
        shell: bash
        run: |
          dir="$RUNNER_TEMP/tessdata"
          mkdir -p "$dir"
          base=https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/e12c65a915945e4c28e237a9b52bc4a8f39a0cec
          curl -fsSL "$base/fra.traineddata" -o "$dir/fra.traineddata"
          curl -fsSL "$base/eng.traineddata" -o "$dir/eng.traineddata"
          cd "$dir"
          printf '%s  %s\n' \
            907743d98915c91a3906dfbf6e48b97598346698fe53aaa797e1a064ffcac913 fra.traineddata \
            8280aed0782fe27257a68ea10fe7ef324ca0f8d85bd2fd145d1c2b560bcb66ba eng.traineddata \
            | if command -v sha256sum > /dev/null; then sha256sum -c -; else shasum -a 256 -c -; fi
          echo "TESSERACT_SMOKE_DATA=$dir" >> "$GITHUB_ENV"
      - run: cargo test ${{ env.WORKSPACE_ARGS }} --locked
      # Whisper on a real recording, the sample interview, with the pinned Base model and the
      # voice-activity model, checked against the hashes the app downloads them with: speech
      # detection, the lines' times, and a stop inside a window through whisper.cpp's abort
      # callback. On the Mac it runs on Metal. Cached on the hashes, so each is fetched once.
      - name: Cache the smoke-test Whisper models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/whisper-smoke
          key: whisper-smoke-422f1ae452ade6f3-29940d98d42b91fb
      - name: Whisper smoke-test models
        shell: bash
        run: |
          dir="$RUNNER_TEMP/whisper-smoke"
          mkdir -p "$dir"
          cd "$dir"
          [ -f ggml-base-q5_1.bin ] || curl -fsSL --retry 5 -o ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q5_1.bin
          [ -f ggml-silero-v5.1.2.bin ] || curl -fsSL --retry 5 -o ggml-silero-v5.1.2.bin \
            https://huggingface.co/ggml-org/whisper-vad/resolve/9ffd54a1e1ee413ddf265af9913beaf518d1639b/ggml-silero-v5.1.2.bin
          printf '%s  %s\n' \
            422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898 ggml-base-q5_1.bin \
            29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf ggml-silero-v5.1.2.bin \
            | if command -v sha256sum > /dev/null; then sha256sum -c -; else shasum -a 256 -c -; fi
      # The runner's default shell, not Git Bash, which on Windows rewrites environment values
      # that look like paths for the programs it starts (CXXFLAGS=/EHsc among them) and would
      # rebuild whisper.cpp with them.
      - name: Whisper smoke test
        timeout-minutes: 15
        env:
          WHISPER_SMOKE_MODEL: ${{ runner.temp }}/whisper-smoke/ggml-base-q5_1.bin
          WHISPER_SMOKE_VAD: ${{ runner.temp }}/whisper-smoke/ggml-silero-v5.1.2.bin
        run: cargo test -p kalamu-offline --locked whisper::tests::smoke -- --ignored --nocapture --exact
      # The app's own binary, linked on every system. The tests above link only test binaries,
      # which leave out what only `main` reaches, so a native library the app needs can be
      # missing without a test noticing: #120's Metal code linked nowhere but in the store and
      # release builds, and on Windows the app was first linked when a release was tagged. A
      # debug build reuses what the tests built.
      - name: Link the app
        run: cargo build -p kalamu --locked
      # The TypeScript bindings, and the rules, lists and worked cases the interface reads from
      # Rust, are written by the tests; they must match what is committed.
      - name: Bindings up to date
        shell: bash
        run: >-
          git diff --exit-code --
          src/lib/bindings
          src/lib/coreLists.json
          src/lib/searchRules.json
          src/lib/matchCases.json
          src/lib/dev/taskRules.json

  rust-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      # Called directly rather than through the `cargo` proxy, which would first install the
      # whole pinned toolchain.
      - name: RustSec audit
        run: cargo-audit audit
      - name: Licences and sources
        run: cargo-deny check licenses sources
