name: llama.cpp

# Builds llama.cpp's multimodal program (`llama-mtmd-cli`), which runs the offline OCR models
# next to Kalamu (docs/llama.md; docs/decisions/2026-11-06-ocr-vision-models.md and
# 2026-11-06-ocr-graphics-processor.md), and its text program (`llama-completion`), which the
# offline language models read texts with (docs/decisions/2026-11-07-offline-language-models.md),
# from the pinned release's source, for the same processors as the Whisper linked into the app
# (`.cargo/config.toml`). MIT licensed. The processor and Vulkan archives hold both programs; the
# OpenCL archive the multimodal program only.
#
# - The processor build, one self-contained executable each for Windows x64 and ARM64, and for
#   macOS on Apple Silicon, where it uses the graphics processor through Metal.
# - The graphics-processor build for Windows x64 and ARM64 (`llama-mtmd-cli-vulkan`), through
#   Vulkan, which the app runs instead when it finds a usable graphics processor. It needs the
#   Vulkan loader that graphics drivers install (vulkan-1.dll), nothing else.
# - The build for Snapdragon's Adreno graphics processor through OpenCL
#   (`llama-mtmd-cli-opencl`, Windows ARM64), with Qualcomm's own kernels. Vulkan reads wrongly
#   on the Adreno; through OpenCL, GLM-OCR's image encoder reads correctly in less than half the
#   processor's time, so the app runs that model's encoder there. It needs the OpenCL loader
#   Qualcomm's driver installs (OpenCL.dll), nothing else.
#
# Each run then times the models on the sample page on its own runner, for the record of how
# fast they read on each kind of processor (the job's summary), and the processor builds check
# that Gemma 4 E2B answers a short analysis in its schema through the text program. GitHub's runners have no
# graphics processor, so the Vulkan and OpenCL builds list the devices they find and read the
# page on the processor; their speed is measured on real machines.
#
# Run by hand when llama.cpp is updated, or through a pull request that changes this file. When
# every build passes, the `publish` job publishes the archives as a GitHub release named
# `llama-<tag>-<n>` and pins their SHA-256 in `scripts/llama.json` on the same branch, so
# `npm run fetch:llama` installs exactly these binaries.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/llama.yml

permissions:
  contents: read

env:
  # The release llama.cpp names v0.9.0 (4 November 2026), and the SHA-256 of its source archive.
  LLAMA_TAG: "b12110"
  LLAMA_SHA256: "442a8ec2c5e8b8895175abfcede851964572370f0a56b33166c94905260da008"
  # LunarG's Vulkan SDK, for the headers, the loader's import library and the shader compiler;
  # nothing from it is shipped but the headers' licence. The installers' SHA-256 are the ones
  # LunarG publishes (https://vulkan.lunarg.com/sdk/sha/<version>/<platform>/<file>.txt).
  VULKAN_SDK_VERSION: "1.4.363.1"
  VULKAN_HEADERS_TAG: "vulkan-sdk-1.4.363.0"
  # Khronos's OpenCL headers (compiled in) and loader (its import library only), for the Adreno
  # build.
  OPENCL_TAG: "v2026.05.29"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-pc-windows-msvc
            runner: windows-latest
            variant: cpu
            program: llama-mtmd-cli
            text: llama-completion
            archive: llama
            # AVX2 with FMA and F16C, as Whisper (`crates/offline/src/cpu.rs` checks them).
            flags: >-
              -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
              -DGGML_SSE42=ON
          - triple: aarch64-pc-windows-msvc
            runner: windows-11-arm
            variant: cpu
            program: llama-mtmd-cli
            text: llama-completion
            archive: llama
            flags: -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16
          - triple: aarch64-apple-darwin
            runner: macos-latest
            variant: cpu
            program: llama-mtmd-cli
            text: llama-completion
            archive: llama
            # Metal, its shaders built into the program; macOS 13 and later, as the app.
            flags: >-
              -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          # The same processor code as the processor build, so a page the graphics processor
          # leaves to it reads the same, plus Vulkan.
          - triple: x86_64-pc-windows-msvc
            runner: windows-latest
            variant: vulkan
            program: llama-mtmd-cli-vulkan
            text: llama-completion-vulkan
            archive: llama-vulkan
            sdk: X64
            sdk_platform: windows
            sdk_sha256: c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a
            flags: >-
              -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
              -DGGML_SSE42=ON -DGGML_VULKAN=ON
          - triple: aarch64-pc-windows-msvc
            runner: windows-11-arm
            variant: vulkan
            program: llama-mtmd-cli-vulkan
            text: llama-completion-vulkan
            archive: llama-vulkan
            sdk: ARM64
            sdk_platform: warm
            sdk_sha256: 29d925e3ee4793f9c3977f34389ccb0273c0347bfacf2f08dd70104d6d096ceb
            flags: -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DGGML_VULKAN=ON
          # Adreno's own OpenCL kernels, as llama.cpp's windows-opencl-adreno build.
          - triple: aarch64-pc-windows-msvc
            runner: windows-11-arm
            variant: opencl
            program: llama-mtmd-cli-opencl
            archive: llama-opencl
            flags: >-
              -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DGGML_OPENCL=ON
              -DGGML_OPENCL_USE_ADRENO_KERNELS=ON
    name: build (${{ matrix.variant }}, ${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Git Bash on Windows has sha256sum but not shasum; macOS has shasum.
      - name: Hash tool
        run: |
          if command -v sha256sum > /dev/null; then echo "SHA256=sha256sum"; else echo "SHA256=shasum -a 256"; fi >> "$GITHUB_ENV"

      - name: Source
        run: |
          curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors -o "llama.cpp-${LLAMA_TAG}.tar.gz" \
            "https://github.com/ggml-org/llama.cpp/archive/refs/tags/${LLAMA_TAG}.tar.gz"
          echo "${LLAMA_SHA256}  llama.cpp-${LLAMA_TAG}.tar.gz" | $SHA256 -c -
          tar -xzf "llama.cpp-${LLAMA_TAG}.tar.gz"

      # The SDK for this runner's own architecture (`warm` is LunarG's name for Windows on Arm),
      # so its shader compiler runs natively while ggml builds its shaders.
      - name: Vulkan SDK
        if: matrix.variant == 'vulkan'
        shell: pwsh
        run: |
          $name = "vulkansdk-windows-${{ matrix.sdk }}-$env:VULKAN_SDK_VERSION.exe"
          $installer = Join-Path $env:RUNNER_TEMP $name
          curl.exe -fsSL --retry 5 --retry-delay 15 --retry-all-errors -o $installer `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/${{ matrix.sdk_platform }}/$name"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($hash -ne '${{ matrix.sdk_sha256 }}') { throw "$name has SHA-256 $hash, expected ${{ matrix.sdk_sha256 }}" }
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          & $installer --root $root --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "The Vulkan SDK did not install ($LASTEXITCODE)." }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH

      # Built with the compiler below, into a folder the llama.cpp build is pointed at. The
      # loader is not shipped: on a Snapdragon, Qualcomm's driver installs its own OpenCL.dll.
      # The one built here is put on PATH so the program starts on the runner, which has none.
      - name: OpenCL headers and loader
        if: matrix.variant == 'opencl'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'opencl'
          git clone --depth 1 --branch $env:OPENCL_TAG https://github.com/KhronosGroup/OpenCL-Headers
          cmake -S OpenCL-Headers -B OpenCL-Headers/build -G Ninja -DBUILD_TESTING=OFF `
            -DOPENCL_HEADERS_BUILD_TESTING=OFF -DOPENCL_HEADERS_BUILD_CXX_TESTS=OFF `
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build OpenCL-Headers/build --target install
          git clone --depth 1 --branch $env:OPENCL_TAG https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cmake -S OpenCL-ICD-Loader -B OpenCL-ICD-Loader/build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build OpenCL-ICD-Loader/build --target install
          "OPENCL_PREFIX=$($prefix -replace '\\', '/')" >> $env:GITHUB_ENV
          "$prefix\bin" >> $env:GITHUB_PATH
        env:
          CC: clang-cl
          CXX: clang-cl

      # clang-cl, as for Whisper: ggml refuses MSVC itself on ARM64, and one compiler for both
      # Windows targets keeps the instruction sets the same as the app's.
      - name: Compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.triple == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}

      # Static throughout: llama.cpp, ggml and the C runtime inside the one executable, so
      # nothing is shipped beside it but what the system or its graphics driver provides. No
      # OpenMP (its runtime is a library of its own), no network (the models are downloaded by
      # the app), no server, tests or examples.
      - name: Build
        run: |
          BUILD=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_SHARED_LIBS=OFF
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
            -DGGML_NATIVE=OFF
            -DGGML_OPENMP=OFF
            -DGGML_BACKEND_DL=OFF
            -DLLAMA_OPENSSL=OFF
            -DLLAMA_BUILD_TESTS=OFF
            -DLLAMA_BUILD_EXAMPLES=OFF
            -DLLAMA_BUILD_SERVER=OFF
            -DLLAMA_BUILD_APP=OFF
            -DLLAMA_BUILD_TOOLS=ON
            ${{ matrix.flags }}
          )
          [ -n "${OPENCL_PREFIX:-}" ] && BUILD+=("-DCMAKE_PREFIX_PATH=${OPENCL_PREFIX}")
          cmake -S "llama.cpp-${LLAMA_TAG}" -B build "${BUILD[@]}"
          targets=(llama-mtmd-cli)
          [ -n "${{ matrix.text }}" ] && targets+=(llama-completion)
          cmake --build build --config Release --target "${targets[@]}" -j 4
          {
            echo "llama.cpp ${LLAMA_TAG}, built by .github/workflows/llama.yml in ${GITHUB_REPOSITORY}, run ${GITHUB_RUN_ID}."
            [ "${{ matrix.variant }}" = vulkan ] && echo "Vulkan SDK ${VULKAN_SDK_VERSION}."
            [ "${{ matrix.variant }}" = opencl ] && echo "OpenCL headers and loader ${OPENCL_TAG}."
            echo "cmake ${BUILD[*]}"
          } > BUILD.txt
          cat BUILD.txt

      - name: Package
        run: |
          exe=""
          [ "$RUNNER_OS" = Windows ] && exe=".exe"
          program=$(find build -name "llama-mtmd-cli${exe}" -type f | head -1)
          dir="${{ matrix.archive }}-${LLAMA_TAG}-${{ matrix.triple }}"
          name="${{ matrix.program }}${exe}"
          mkdir -p "$dir/licenses"
          cp "$program" "$dir/$name"
          names=("$name")
          if [ -n "${{ matrix.text }}" ]; then
            text=$(find build -name "llama-completion${exe}" -type f | head -1)
            cp "$text" "$dir/${{ matrix.text }}${exe}"
            names+=("${{ matrix.text }}${exe}")
          fi
          cp "llama.cpp-${LLAMA_TAG}/LICENSE" "$dir/licenses/llama.cpp-MIT.txt"
          cp BUILD.txt "$dir/"
          if [ "${{ matrix.variant }}" = vulkan ]; then
            # Vulkan's headers (Apache-2.0 OR MIT; taken under MIT) are compiled into the program.
            curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors -o "$dir/licenses/Vulkan-Headers-MIT.txt" \
              "https://raw.githubusercontent.com/KhronosGroup/Vulkan-Headers/${VULKAN_HEADERS_TAG}/LICENSES/MIT.txt"
          fi
          if [ "${{ matrix.variant }}" = opencl ]; then
            # Khronos's OpenCL headers (Apache 2.0) are compiled into the program.
            cp OpenCL-Headers/LICENSE "$dir/licenses/OpenCL-Headers-Apache-2.0.txt"
          fi
          for exe_name in "${names[@]}"; do
            "$dir/$exe_name" --version
            # Nothing but the system's own libraries, and for the graphics-processor builds the
            # loader graphics drivers install (vulkan-1.dll, OpenCL.dll).
            if [ "$RUNNER_OS" = macOS ]; then
              otool -L "$dir/$exe_name" | tee deps.txt
              if tail -n +2 deps.txt | grep -v -E '^\s+(/usr/lib/|/System/Library/)'; then
                echo "::error::$exe_name links a library macOS does not have."; exit 1
              fi
            else
              dumpbin //dependents "$dir/$exe_name" | tee deps.txt
              # Only the listed libraries, not the header that names the file itself.
              if grep -i -E '^\s+\S+\.dll\s*$' deps.txt | grep -i -E 'msvcp|vcruntime|vcomp|libomp|ggml|llama|mtmd'; then
                echo "::error::$exe_name needs a library Windows does not have."; exit 1
              fi
              if [ "${{ matrix.variant }}" = vulkan ] && ! grep -qi 'vulkan-1\.dll' deps.txt; then
                echo "::error::$exe_name was built without Vulkan."; exit 1
              fi
              if [ "${{ matrix.variant }}" = opencl ] && ! grep -qi 'OpenCL\.dll' deps.txt; then
                echo "::error::$exe_name was built without OpenCL."; exit 1
              fi
            fi
          done
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -Command "Compress-Archive -Path '$dir/*' -DestinationPath '$dir.zip'"
          else
            (cd "$dir" && zip -r "../$dir.zip" .)
          fi
          $SHA256 "$dir.zip" | tee "$dir.zip.sha256"
          ls -l "$dir"
          echo "DIR=$dir" >> "$GITHUB_ENV"
          echo "PROGRAM=$name" >> "$GITHUB_ENV"
          echo "TEXT_PROGRAM=${{ matrix.text }}${exe}" >> "$GITHUB_ENV"

      # The OCR models' files, pinned as in crates/offline/src/vision.rs.
      - uses: actions/cache@v6
        id: models
        with:
          path: models
          key: ocr-models-lightonocr-3-1b-ff5c331-glm-ocr-65a42de

      - name: Models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          get() {
            curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors -o "models/$2" "https://huggingface.co/$1/resolve/$3/$2"
            echo "$4  models/$2" | $SHA256 -c -
          }
          get prithivMLmods/LightOnOCR-3-1B-GGUF LightOnOCR-3-1B.Q8_0.gguf ff5c331ec2cfee9de1c8054c21ccf88b8c5b0faa 2cf9771aaf236a1c25f389a344510c9ad4daa863e5fdd82651cf7d7834fede1c
          get prithivMLmods/LightOnOCR-3-1B-GGUF LightOnOCR-3-1B.mmproj-q8_0.gguf ff5c331ec2cfee9de1c8054c21ccf88b8c5b0faa 7bbf40e6f3e91626843fdcbba67c7fe774821f3f0c537dcc8c769026a528839a
          get ggml-org/GLM-OCR-GGUF GLM-OCR-Q8_0.gguf 65a42de1148dbed2297e922b5dbc7d9b70c36578 45bc244a6446aff850521dc41f18bc8d7105ad5f0c2c8c28af04e7cc4f4d50b1
          get ggml-org/GLM-OCR-GGUF mmproj-GLM-OCR-Q8_0.gguf 65a42de1148dbed2297e922b5dbc7d9b70c36578 9c4b58e33e316ed142eb5dcb41abec3844d3e6e5dc361ffb782c3fa9d175141f

      # What the graphics-processor builds find here: on GitHub's runners, no graphics
      # processor, so the page below is read on the processor, as the app would not do.
      - name: Devices
        if: matrix.variant != 'cpu'
        run: |
          {
            echo "### ${{ matrix.variant }} on ${{ matrix.triple }}: devices"
            echo
            echo '```'
            "$DIR/$PROGRAM" --list-devices 2>&1 | tail -20 || echo "--list-devices failed ($?)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The arguments the app gives (vision.rs, `arguments`), on the sample page, which is
      # smaller than either model's largest image and is sent as it is. The processor builds
      # time both models; the others read the page once with GLM-OCR, to show they work.
      - name: Time the models on the sample page
        run: |
          # As the app (crates/offline/src/cpu.rs): half the logical processors on x64, all but
          # one on ARM64.
          if [ "$RUNNER_OS" = macOS ]; then logical=$(sysctl -n hw.ncpu); else logical=$(nproc); fi
          case "${{ matrix.triple }}" in
            x86_64-*) threads=$(( logical / 2 )) ;;
            *) threads=$(( logical - 1 )) ;;
          esac
          [ "$threads" -lt 1 ] && threads=1
          [ "$threads" -gt 8 ] && threads=8
          variant="${{ matrix.variant }}"
          run() {
            local name=$1 model=$2 encoder=$3 prompt=$4
            local start end
            start=$(date +%s)
            "$DIR/$PROGRAM" -m "models/$model" --mmproj "models/$encoder" \
              --image samples/bulletin-page.jpg -p "<__media__>${prompt}"$'\n' --jinja --temp 0 \
              -n 6144 -c 10240 -b 4096 -ub 4096 -t "$threads" -ngl 99 --no-warmup \
              > "$variant-$name.txt" 2> "$variant-$name.log" || { tail -30 "$variant-$name.log"; failed=1; return; }
            end=$(date +%s)
            {
              echo "### $name: $((end - start)) s on ${{ matrix.triple }}, $variant build ($threads threads)"
              echo
              echo '```'
              head -c 1500 "$variant-$name.txt"
              echo
              echo '```'
              grep -E 'using device|llama_perf_context_print|image slice|encoded in' "$variant-$name.log" | tail -8 | sed 's/^/    /' || true
            } | tee -a "$GITHUB_STEP_SUMMARY"
            if ! grep -qi bulletin "$variant-$name.txt"; then
              echo "::error::$name did not read the page's title (BULLETIN)."
              tail -40 "$variant-$name.log"
              failed=1
            fi
            # LightOnOCR's grounding mode places each block: `![text](80,175,920,225)`.
            if [ "$prompt" = grounding ] && ! grep -qE '^!\[[a-z_+]+\]\([0-9]+, ?[0-9]+, ?[0-9]+, ?[0-9]+\)' "$variant-$name.txt"; then
              echo "::error::$name wrote no block positions in grounding mode."
              failed=1
            fi
          }
          failed=0
          if [ "$variant" = cpu ]; then
            run lightonocr-3-1b LightOnOCR-3-1B.Q8_0.gguf LightOnOCR-3-1B.mmproj-q8_0.gguf grounding
          fi
          run glm-ocr GLM-OCR-Q8_0.gguf mmproj-GLM-OCR-Q8_0.gguf "Text Recognition:"
          exit "$failed"

      # Gemma 4 E2B's language model, pinned as in crates/offline/src/llm.rs; the text program
      # does not load its encoder.
      - uses: actions/cache@v6
        if: matrix.variant == 'cpu'
        id: gemma
        with:
          path: gemma
          key: gemma-4-e2b-675cff4

      - name: Gemma
        if: matrix.variant == 'cpu' && steps.gemma.outputs.cache-hit != 'true'
        run: |
          mkdir -p gemma
          curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors -o gemma/gemma-4-E2B_q4_0-it.gguf \
            "https://huggingface.co/google/gemma-4-E2B-it-qat-q4_0-gguf/resolve/675cff42a74c774d6cb76f76d8eacb49b48c9b93/gemma-4-E2B_q4_0-it.gguf"
          echo "fa401b55b07ee70a54c6dae3903c783a6e65064312529ea57175cb5f8dec6634  gemma/gemma-4-E2B_q4_0-it.gguf" | $SHA256 -c -

      # The arguments the app gives a text (llm.rs, `text_arguments`): instructions, text and
      # schema from files, one turn without thinking, the answer held to the schema. Fails if
      # the answer is not the schema's JSON.
      - name: Analyse a short text with Gemma 4 E2B
        if: matrix.variant == 'cpu'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then logical=$(sysctl -n hw.ncpu); else logical=$(nproc); fi
          case "${{ matrix.triple }}" in
            x86_64-*) threads=$(( logical / 2 )) ;;
            *) threads=$(( logical - 1 )) ;;
          esac
          [ "$threads" -lt 1 ] && threads=1
          [ "$threads" -gt 8 ] && threads=8
          printf '%s' "You analyse historical documents. Answer in French." > instructions.txt
          {
            echo '<document name="bulletin.txt">'
            echo "Dakar, le 3 mai 1957. Le Gouverneur général a reçu ce matin les délégués des syndicats de Dakar et de Thiès, qui lui ont remis un mémoire sur les salaires des cheminots."
            echo '</document>'
            echo
            printf '%s' "Fill in the fields for this document."
          } > request.txt
          echo '{"type":"object","properties":{"summary":{"type":"string","description":"Summary: one sentence"},"places":{"type":"array","items":{"type":"string"},"description":"Places: as spelled in the document"},"tone":{"type":"string","enum":["Positive","Neutral","Negative"],"description":"Tone"}},"required":["summary","places","tone"],"additionalProperties":false}' > schema.json
          start=$(date +%s)
          "$DIR/$TEXT_PROGRAM" -m gemma/gemma-4-E2B_q4_0-it.gguf -jf schema.json --jinja --temp 0 \
            -n 8192 -c 32768 -b 2048 -ub 2048 -t "$threads" -ngl auto --fit on --no-warmup \
            -sysf instructions.txt -f request.txt -cnv -st --reasoning off --no-display-prompt \
            > gemma-e2b.txt 2> gemma-e2b.log || { tail -40 gemma-e2b.log; exit 1; }
          end=$(date +%s)
          answer=$(sed 's/ *\[end of text\] *$//' gemma-e2b.txt)
          {
            echo "### gemma-4-e2b: $((end - start)) s on ${{ matrix.triple }} ($threads threads)"
            echo
            echo '```'
            echo "$answer"
            echo '```'
            grep -E 'llama_perf_context_print' gemma-e2b.log | tail -4 | sed 's/^/    /' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Python is on every runner (jq may not be on Windows on Arm's).
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          check='import json, sys; a = json.load(sys.stdin); assert isinstance(a["summary"], str) and isinstance(a["places"], list) and a["tone"] in ("Positive", "Neutral", "Negative")'
          if ! echo "$answer" | "$py" -c "$check"; then
            echo "::error::Gemma 4 E2B's answer is not the schema's JSON."
            tail -40 gemma-e2b.log
            exit 1
          fi

      # Kept even when a model misreads the page, so its answer can be read.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: llama-${{ matrix.variant }}-${{ matrix.triple }}
          path: |
            llama*.zip
            llama*.zip.sha256
            ${{ matrix.variant }}-*.txt
            gemma-*.txt

  # Once every build and its timing pass: the processor, Vulkan and OpenCL archives published as
  # a GitHub release (a pre-release holding only them, as FFmpeg's, so it never becomes the app's
  # "Latest"), their SHA-256 written into scripts/llama.json and committed to the branch that ran
  # this, and the Mac App Store sandbox check run again on that commit, since a commit pushed
  # with this job's token starts no workflow by itself. Skipped when scripts/llama.json already
  # pins this tag with every archive, and for pull requests from forks, which get no write
  # access.
  publish:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency: llama-publish
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      # The branch's commit, not the merge commit a pull request's run is checked out at.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRIPLES: x86_64-pc-windows-msvc aarch64-pc-windows-msvc aarch64-apple-darwin
      VULKAN_TRIPLES: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      OPENCL_TRIPLES: aarch64-pc-windows-msvc
    steps:
      # Credentials kept, unlike the other jobs: this one pushes the pins.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}

      - name: Already pinned?
        id: pinned
        run: |
          if jq -e --arg tag "$LLAMA_TAG" \
            '.version == $tag
              and .programs == ["llama-mtmd-cli", "llama-completion"]
              and ([.archives[].sha256] | all(length == 64))
              and ((.vulkan // {}) | has("x86_64-pc-windows-msvc") and has("aarch64-pc-windows-msvc"))
              and ([.vulkan[].sha256] | all(length == 64))
              and ((.opencl // {}) | has("aarch64-pc-windows-msvc"))
              and ([.opencl[].sha256] | all(length == 64))' scripts/llama.json > /dev/null; then
            echo "scripts/llama.json already pins llama.cpp ${LLAMA_TAG}: nothing to publish."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.pinned.outputs.done != 'true'
        with:
          pattern: llama-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        if: steps.pinned.outputs.done != 'true'
        run: |
          # The next free number, so a second build of the same tag never replaces the first.
          n=1
          while gh release view "llama-${LLAMA_TAG}-${n}" > /dev/null 2>&1; do n=$((n + 1)); done
          release="llama-${LLAMA_TAG}-${n}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          files=()
          for t in $TRIPLES; do files+=("dist/llama-${LLAMA_TAG}-${t}.zip"); done
          for t in $VULKAN_TRIPLES; do files+=("dist/llama-vulkan-${LLAMA_TAG}-${t}.zip"); done
          for t in $OPENCL_TRIPLES; do files+=("dist/llama-opencl-${LLAMA_TAG}-${t}.zip"); done
          {
            echo "llama.cpp's multimodal program (\`llama-mtmd-cli\`) and text program (\`llama-completion\`) as bundled with Kalamu to run the offline OCR and language models: llama.cpp ${LLAMA_TAG}, static executables for Windows x64, Windows ARM64 and macOS on Apple Silicon (Metal), and for Windows x64 and ARM64 a second pair that uses the graphics processor through Vulkan (\`llama-mtmd-cli-vulkan\`, \`llama-completion-vulkan\`, Vulkan SDK ${VULKAN_SDK_VERSION}), and for Windows ARM64 a multimodal program for Snapdragon's Adreno through OpenCL (\`llama-mtmd-cli-opencl\`, Khronos headers ${OPENCL_TAG}). This release only holds the archives the app is built with; it is not an app release."
            echo
            echo "- **Licence**: MIT (\`licenses/llama.cpp-MIT.txt\` in each archive; the Vulkan and OpenCL builds add their headers' licences). llama.cpp is not modified."
            echo "- **Source**: [${LLAMA_TAG}](https://github.com/ggml-org/llama.cpp/releases/tag/${LLAMA_TAG}), source archive SHA-256 \`${LLAMA_SHA256}\`; each archive's \`BUILD.txt\` gives the build line."
            echo "- **Built by** [.github/workflows/llama.yml](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/.github/workflows/llama.yml), [run ${GITHUB_RUN_ID}](${run_url}), whose summaries give each model's time on the sample page. How it is used: [docs/llama.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/llama.md)."
            echo
            echo "SHA-256:"
            echo
            for f in "${files[@]}"; do
              echo "- \`$(basename "$f")\`: \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            done
          } > notes.md
          gh release create "$release" "${files[@]}" --target "$HEAD_SHA" \
            --title "llama.cpp ${LLAMA_TAG} (offline OCR and language models) for Kalamu" \
            --notes-file notes.md --prerelease --latest=false
          pins() {
            local prefix=$1; shift
            for t in "$@"; do
              printf '%s\t%s\n' "$t" "$(sha256sum "dist/${prefix}-${LLAMA_TAG}-${t}.zip" | cut -d' ' -f1)"
            done | jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {key: .[0], value: {sha256: .[1]}}) | from_entries'
          }
          # shellcheck disable=SC2086
          archives=$(pins llama $TRIPLES)
          # shellcheck disable=SC2086
          vulkan=$(pins llama-vulkan $VULKAN_TRIPLES)
          # shellcheck disable=SC2086
          opencl=$(pins llama-opencl $OPENCL_TRIPLES)
          jq --tab --arg release "$release" --arg version "$LLAMA_TAG" \
            --argjson archives "$archives" --argjson vulkan "$vulkan" --argjson opencl "$opencl" \
            '.release = $release | .version = $version | .programs = ["llama-mtmd-cli", "llama-completion"] | .archives = $archives | .vulkan = $vulkan | .opencl = $opencl' \
            scripts/llama.json > llama.json
          mv llama.json scripts/llama.json
          cat scripts/llama.json
          echo "RELEASE=$release" >> "$GITHUB_ENV"

      - name: Pin it on the branch
        if: steps.pinned.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/llama.json
          git commit -m "Pin llama.cpp ${LLAMA_TAG} from release ${RELEASE}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"
          # The sandbox check fetches the pinned program; run it on the new commit.
          gh workflow run app-store.yml --ref "$BRANCH"
